appId: com.ats.assettransformationservice
productName: Asset Transformation Service
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/better-sqlite3/**
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - node_modules/draco3dgltf/**
  - node_modules/fbx2gltf/**
npmRebuild: true
mac:
  target: dmg
  category: public.app-category.developer-tools
win:
  target: nsis
linux:
  target: AppImage
